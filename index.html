<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vincenzo D'Aria</title>

    <!-- Resolve the theme before first paint (no flash). Mirrors hooks/useTheme. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12110f" media="(prefers-color-scheme: dark)" />

    <!-- Primary Meta -->
    <meta name="description" content="Vincenzo D'Aria — full-stack software engineer building cloud-native, data-driven systems. Work, writing, and this year's goals." />
    <meta name="author" content="Vincenzo D'Aria" />
